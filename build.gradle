plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Local flatDir for mod JARs that aren't reliably on any public Maven.
    // AE2 19.2.18 is only published as "neoforge" on Modrinth (but the
    // jar is loader-agnostic for the 1.21.x builds). Immersive Portals'
    // Maven coordinate uses the project_id, not the slug. And
    // maven.terraformers.dev was unreachable as of Oct 2026.
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // AE2 — downloaded from Modrinth CDN, placed in libs/
    modImplementation files('libs/appliedenergistics2-19.2.18.jar')

    // Immersive Portals — downloaded from Modrinth CDN, placed in libs/
    modImplementation files('libs/immersive-portals-6.0.6-mc1.21.1-fabric.jar')
}

processResources {
    filesMatching('fabric.mod.json') {
        expand([
            version          : project.version,
            minecraft_version : project.minecraft_version,
            loader_version   : project.loader_version,
            ae2_version      : project.ae2_version,
            imm_ptl_version  : project.imm_ptl_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
